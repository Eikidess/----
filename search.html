<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пошук — Українські прізвища</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="search.css">
    <script>
        (function () {
            var stored = localStorage.getItem("site-theme");
            var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
</head>
<body class="search-page">
    <header>
        <div class="header-bar">
            <h1>Українські прізвища та їхній розподіл</h1>
            <button id="themeToggle" class="theme-toggle" type="button" aria-label="Перемкнути тему оформлення">
                <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </div>
        <nav>
            <a href="search.html" class="active">Пошук</a>
            <a href="index.html#map">Карта</a>
            <a href="history.html">Історія</a>
            <a href="compare.html">Порівняння</a>
        </nav>
    </header>

    <main class="finder-wrap">
        <form class="finder" id="finderForm" autocomplete="off" novalidate>
            <div class="search-input-wrap">
                <input id="finderInput" class="finder-input" type="text" placeholder="Введіть прізвище" autocomplete="off" aria-label="Прізвище">
                <ul id="suggestions" class="suggestions-list" role="listbox" hidden></ul>
            </div>
            <button class="finder-btn" type="submit" aria-label="Пошук">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
        </form>
        <p class="finder-msg" id="finderMsg" aria-live="polite"></p>

        <section class="finder-links" aria-label="Розділи сайту">
            <p class="finder-hint">Або перейдіть одразу до розділу</p>
            <div class="finder-cards">
                <a class="finder-card" href="index.html#map">
                    <strong>Карта</strong>
                    <span>Розподіл прізвищ по областях України</span>
                </a>
                <a class="finder-card" href="history.html">
                    <strong>Історія</strong>
                    <span>Як виникли прізвища: сім інтерактивних кроків</span>
                </a>
                <a class="finder-card" href="compare.html">
                    <strong>Порівняння</strong>
                    <span>Прізвища з курсової та топ-100 України</span>
                </a>
            </div>
        </section>
    </main>

    <script src="data/surnames-data.js"></script>
    <script src="theme.js"></script>
    <script src="search.js"></script>
</body>
</html>
